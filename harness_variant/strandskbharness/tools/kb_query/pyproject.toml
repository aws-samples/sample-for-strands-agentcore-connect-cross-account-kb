[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb_query_tool"
version = "0.1.0"
description = "AgentCore Gateway Lambda tool: cross-account Bedrock Knowledge Base query"
requires-python = ">=3.10"
dependencies = [
    "boto3 >= 1.42.0",
    "botocore >= 1.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
